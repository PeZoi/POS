spring.application.name=be

# ===============================
# DATASOURCE (MYSQL OUTSIDE DOCKER)
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pos?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Phiên PIN: đổi secret trên môi trường thật (chuỗi dài, ngẫu nhiên)
pos.session.secret=${POS_SESSION_SECRET:pos-dev-secret-change-in-production-min-32-chars}
pos.session.ttl-seconds=${POS_SESSION_TTL_SECONDS:43200}

# Khóa nhập PIN sau N lần sai (mặc định 5), thời gian khóa (phút)
pos.pin.max-failed-attempts=${POS_PIN_MAX_FAILED:5}
pos.pin.lock-duration-minutes=${POS_PIN_LOCK_MINUTES:1}