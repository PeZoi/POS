map $http_cf_ipcountry $vn_ok {
    default 0;
    VN 1;
}

server {
    listen 80;
    server_name pos-toy.click www.pos-toy.click;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Allow ACME challenge (certbot webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Root domain sẽ được backend redirect động sang activeDomain (301).
    location /api {
        # Lock origin to Cloudflare + allow only Vietnam
        include /etc/nginx/conf.d/cloudflare-allow.conf;
        if ($vn_ok = 0) { return 403; }

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        # Lock origin to Cloudflare + allow only Vietnam
        include /etc/nginx/conf.d/cloudflare-allow.conf;
        if ($vn_ok = 0) { return 403; }

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

server {
    listen 80 default_server;
    server_name *.pos-toy.click;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Allow ACME challenge (certbot webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location /api {
        # Lock origin to Cloudflare + allow only Vietnam
        include /etc/nginx/conf.d/cloudflare-allow.conf;
        if ($vn_ok = 0) { return 403; }

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # HTTPS is terminated at the proxy/CDN layer (Hướng B)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /ws/pybarcode {
        # Lock origin to Cloudflare + allow only Vietnam
        include /etc/nginx/conf.d/cloudflare-allow.conf;
        if ($vn_ok = 0) { return 403; }

        proxy_pass http://scanner-py:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        # Lock origin to Cloudflare + allow only Vietnam
        include /etc/nginx/conf.d/cloudflare-allow.conf;
        if ($vn_ok = 0) { return 403; }

        try_files $uri $uri/ /index.html;
    }
}
