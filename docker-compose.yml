services:
  mysql:
    image: mysql:8.0
    container_name: pos-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pos}
      MYSQL_USER: ${MYSQL_USER:-viendong}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./be
    expose:
      - "8080"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      POS_MYSQLDUMP_CMD: mariadb-dump
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/pos?useSSL=false&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MYSQL_ROOT_PASSWORD:-root}}
      POS_SESSION_SECRET: ${POS_SESSION_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      APP_ENV: production
      POS_TELEGRAM_WEBHOOK_SECRET: ${POS_TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scanner-py:
    build: ./scanner-py
    expose:
      - "8765"
    environment:
      PY_BARCODE_PORT: "8765"
      BARCODE_DECODE_WORKERS: ${BARCODE_DECODE_WORKERS:-}
      STRICT_GTIN: ${STRICT_GTIN:-}

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - scanner-py
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    command: >
      sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $$!;
      done"

volumes:
  mysql-data:
  letsencrypt:
  certbot-webroot: