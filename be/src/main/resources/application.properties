spring.application.name=be

# Load env from .env (docker-compose)
spring.config.import=optional:file:.env[.properties]

# ===============================
# DATASOURCE (MYSQL OUTSIDE DOCKER)
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pos?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Phiên PIN: đổi secret trên môi trường thật (chuỗi dài, ngẫu nhiên)
pos.session.secret=${POS_SESSION_SECRET:pos-dev-secret-change-in-production-min-32-chars}
pos.session.ttl-seconds=${POS_SESSION_TTL_SECONDS:43200}

# Khóa nhập PIN sau N lần sai (mặc định 5), thời gian khóa (phút)
pos.pin.max-failed-attempts=${POS_PIN_MAX_FAILED:5}
pos.pin.lock-duration-minutes=${POS_PIN_LOCK_MINUTES:1}

# ===============================
# TELEGRAM (Bot API sendMessage — tương tự class-management TelegramNotifier)
# ===============================
pos.telegram.enabled=${POS_TELEGRAM_ENABLED:true}
pos.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
pos.telegram.chat-id=${TELEGRAM_CHAT_ID:}
pos.telegram.env=${APP_ENV:local}
pos.telegram.service-name=${POS_TELEGRAM_SERVICE_NAME:pos-api}
pos.telegram.webhook-secret=${POS_TELEGRAM_WEBHOOK_SECRET}

# ===============================
# BACKUP MYSQL (mysqldump mỗi ngày — bật pos.backup.enabled=true)
# pos.backup.mysqldump-command: mặc định mysqldump. Nhiều token = cách nhau bằng dấu phẩy (không cách space),
# ví dụ MySQL chỉ trong Docker, backend chạy trên host: docker,exec,TEN_CONTAINER,mysqldump
# Image backend cài mariadb-client: nên dùng mariadb-dump (POS_MYSQLDUMP_CMD) + tắt SSL nội bộ Docker.
# Giờ backup (HH:mm trong DB) so với múi này — mặc định VN (tránh container UTC làm lệch 7 tiếng).
# ===============================
pos.backup.enabled=${POS_BACKUP_ENABLED:true}
pos.backup.output-dir=${POS_BACKUP_DIR:./backups}
pos.backup.mysqldump-command=${POS_MYSQLDUMP_CMD:mysqldump}
# Tắt TLS khi dump. mariadb-dump (Alpine): chỉ dùng --ssl=0 — KHÔNG dùng ssl-mode (MySQL 8) vì MariaDB báo unknown variable.
pos.backup.mysqldump-extra-args=${POS_BACKUP_MYSQLDUMP_EXTRA_ARGS:--ssl=0}
pos.backup.zone-id=${POS_BACKUP_ZONE_ID:Asia/Ho_Chi_Minh}
pos.backup.poll-ms=${POS_BACKUP_POLL_MS:30000}